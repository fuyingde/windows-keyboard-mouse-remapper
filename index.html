<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>键鼠映射工具 V1.7 （开源版）</title>
<style>
  :root {
    --app-bg: #F4F7FB;
    --panel-bg: #F8FAFD;
    --card-bg: #FFFFFF;
    --primary: #1677FF;
    --primary-hover: #0F6DE8;
    --text-main: #17233C;
    --text-normal: #344054;
    --text-secondary: #8993A4;
    --border: #E8ECF2;
    --danger: #E5484D;
    --radius-small: 7px;
    --radius-normal: 10px;
    --radius-large: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-width: 1020px;
    min-height: 600px;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    background: #EAF0F7;
    color: var(--text-normal);
    user-select: none;
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  button, input { font: inherit; }
  button { user-select: none; }

  .app {
    position: relative;
    width: 1020px;
    height: 600px;
    overflow: hidden;
    background: var(--app-bg);
    border: 1px solid #DDE4ED;
    box-shadow: 0 10px 30px rgba(35, 55, 85, 0.10);
  }

  .app, .app * { user-select: none; }

  .titlebar {
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 12px;
    background: #FAFBFD;
    border-bottom: 1px solid #EDF0F5;
  }

  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .title-icon {
    width: 24px;
    height: 24px;
    flex: 0 0 24px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(135deg, #4A8DFF, #1769E8);
    box-shadow: 0 3px 8px rgba(22,119,255,.18);
  }

  .title-icon svg { width: 15px; height: 15px; display: block; }

  .title-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: .1px;
  }

  .global-input-control {
    height: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 33px;
    font-size: 11px;
    -webkit-app-region: no-drag;
  }

  .global-input-switch {
    position: relative;
    width: 36px;
    height: 20px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: #C8D0DC;
    cursor: pointer;
  }

  .global-input-switch::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 1px 3px rgba(24, 37, 59, .22);
    transition: transform .16s ease;
  }

  .global-input-switch.on { background: #2D73F5; }
  .global-input-switch.on::after { transform: translateX(16px); }
  .global-input-disabled-note {
    display: none;
    color: #D93F45;
    font-size: 11px;
    white-space: nowrap;
  }

  .global-input-control.off .global-input-disabled-note { display: inline; }

  .window-actions {
    height: 100%;
    display: flex;
    align-items: stretch;
  }

  .win-btn {
    width: 42px;
    height: 41px;
    border: 0;
    background: transparent;
    color: #637083;
    display: grid;
    place-items: center;
    cursor: default;
    padding: 0;
  }

  .win-btn:hover { background: #F0F3F7; }
  .win-btn.close:hover { background: #E81123; color: #fff; }
  .win-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .win-btn.topmost svg { width: 14px; height: 14px; }
  .win-btn.topmost.active { color: #1769E8; background: #E8F1FF; }
  .win-btn.topmost.active svg { fill: rgba(23, 105, 232, .14); stroke-width: 1.8; }

  .content {
    height: 558px;
    min-height: 0;
    display: grid;
    grid-template-columns: 286px minmax(0, 1fr);
    overflow: hidden;
  }

  .sidebar {
    --auto-bottom-offset: 16px;
    --auto-control-gap: 9px;
    --auto-status-height: 51px;
    position: relative;
    padding: 20px 17px 16px;
    background: #FBFCFE;
    border-right: 1px solid #EDF0F5;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .brand-logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    color: white;
    background: linear-gradient(135deg, #5D9EFF, #1769E8);
    box-shadow: 0 6px 16px rgba(22,119,255,.18);
  }

  .brand-logo svg { width: 38px; height: 38px; display: block; }

  .brand-title {
    margin-top: 12px;
    color: var(--text-main);
    font-size: 17px;
    line-height: 1.25;
    font-weight: 600;
  }

  .brand-subtitle {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--text-secondary);
  }

  .add-area {
    margin-top: 28px;
  }

  .add-btn {
    display: block;
    margin: 0 auto;
    width: 180px;
    height: 42px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #3B82F6, #1769E8);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(23, 105, 232, .18);
  }

  .add-btn:hover { background: linear-gradient(135deg, #347CF0, #1262DA); }
  .add-btn:active { transform: translateY(1px); }

  .add-warning {
    display: none;
    width: 242px;
    margin: 17px auto 0;
    color: #C7464B;
    font-size: 12px;
    line-height: 1.45;
    text-align: center;
  }

  .add-warning.show { display: block; }

  .hidden { display: none !important; }

  .auto-controls {
    position: absolute;
    left: 11px;
    right: 11px;
    bottom: calc(var(--auto-bottom-offset) + var(--auto-status-height) + var(--auto-control-gap));
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px 8px;
    margin: 0;
  }

  .auto-hold-control {
    position: absolute;
    left: 11px;
    right: 11px;
    bottom: calc(var(--auto-bottom-offset) + var(--auto-status-height) + var(--auto-control-gap));
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .auto-hold-control .split-control {
    width: 100%;
  }

  .split-control {
    height: 38px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 30px;
    border: 1px solid #DCE4EF;
    border-radius: 9px;
    overflow: hidden;
    background: #FFFFFF;
    box-shadow: 0 2px 7px rgba(30, 50, 80, .04);
  }

  .split-control > button {
    border: 0;
    background: transparent;
    color: #43516A;
    cursor: pointer;
  }

  .split-control .run-control {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; font-size: 11.5px; font-weight: 400; line-height: 1.05;
  }
  .split-control .run-control span { white-space: nowrap; }
  .split-control .run-control small { color: #98A2B3; font-size: 9px; font-weight: 400; }
  .split-control .control-menu {
    position: relative;
    border-left: 1px solid #E4EAF2;
    color: #758197;
    display: grid;
    place-items: center;
  }
  .split-control .control-menu svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .split-control > button:hover { background: #F3F7FC; color: #1769E8; }

  .auto-status-card {
    position: absolute;
    left: 11px;
    right: 11px;
    bottom: var(--auto-bottom-offset);
    height: var(--auto-status-height);
    margin: 0;
    padding: 0 12px;
    border: 1px solid #E5EAF2;
    border-radius: 10px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .auto-status-dot {
    display: inline-block; width: 7px; height: 7px; margin-right: 7px;
    border-radius: 50%; background: #AEB7C5;
  }
  .auto-status-card.running .auto-status-dot { background: #20A464; box-shadow: 0 0 0 3px rgba(32,164,100,.10); }
  .auto-status-card.paused .auto-status-dot { background: #E8A324; }
  .auto-status-text { font-size: 12.5px; font-weight: 600; color: #526076; }

  .auto-toolbar {
    display: flex; align-items: center; gap: 7px; margin-left: auto;
  }
  .mode-label { color: #8993A4; font-size: 11px; }
  .activation-select {
    height: 27px; padding: 0 25px 0 9px; border: 1px solid #DCE4EF;
    border-radius: 7px; background: #FFFFFF; color: #526076; font-size: 11px;
    cursor: pointer; outline: none;
  }

  .auto-item.locked {
    background: #F6F7F9;
    border-color: #E7E9ED;
    color: #98A0AD;
  }
  .auto-check-wrap {
    flex: 0 0 24px; width: 24px; height: 32px; display: grid; place-items: center;
  }
  .auto-check {
    width: 16px; height: 16px; margin: 0; accent-color: #1677FF; cursor: pointer;
  }
  .auto-item.locked .auto-check-wrap { cursor: not-allowed; }
  .auto-item.locked .auto-check { pointer-events: none; opacity: .42; }
  .auto-combo {
    flex: 0 0 212px; min-width: 0; height: 38px; display: flex; align-items: center;
    justify-content: center; padding: 0 10px; border: 1px solid #DCEAFF;
    border-radius: 8px; background: #EEF5FF; color: #2D4F84; font-size: 14px;
    font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .auto-item.locked .auto-combo { border-color: #E2E5EA; background: #ECEEF2; color: #8F97A4; }
  .auto-meta { min-width: 0; flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .auto-meta-cell { min-width: 0; text-align: center; }
  .auto-meta-name { margin-bottom: 3px; color: #98A2B3; font-size: 10px; text-align: center; }
  .auto-meta-value { color: #526076; font-size: 11.5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .auto-item.locked .auto-meta-value { color: #929AA7; }
  .auto-item.independent .auto-meta { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }

  .editor-backdrop {
    position: absolute; inset: 0; z-index: 1100; display: none;
    align-items: center; justify-content: center; background: rgba(23,35,60,.20);
  }
  .editor-backdrop.show { display: flex; }
  .editor-dialog {
    width: 430px; padding: 19px; border: 1px solid #E1E7F0; border-radius: 14px;
    background: #FFFFFF; box-shadow: 0 16px 42px rgba(25,42,70,.20);
  }
  .auto-editor-dialog { width: 440px; }
  .editor-title { margin-bottom: 15px; color: #24334A; font-size: 16px; font-weight: 700; }
  .editor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .editor-field.full { grid-column: 1 / -1; }
  .auto-editor-dialog.independent-editor .auto-key-field { grid-column: span 2; }
  .auto-editor-dialog.independent-editor #independentHotkeyField { grid-column: span 1; }
  .editor-label { display: block; margin-bottom: 6px; color: #667085; font-size: 11.5px; }
  .editor-label-row { height: 18px; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .editor-label-row .editor-label { min-width: 0; margin-bottom: 0; }
  .editor-input, .editor-select, .editor-record {
    width: 100%; height: 38px; border: 1px solid #DCE4EF; border-radius: 8px;
    background: #FBFCFE; color: #344054; outline: none; font-size: 12px;
  }
  .editor-input { padding: 0 10px; user-select: text; }
  .editor-select { padding: 0 9px; }
  .editor-record { cursor: pointer; color: #1769E8; border-style: dashed; }
  .editor-record.recording { border-style: solid; border-color: #1677FF; background: #F2F7FF; }
  .editor-record-wrap { position: relative; width: 100%; height: 38px; }
  .editor-record-wrap .editor-record { padding: 0 24px; }
  .editor-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }
  .emergency-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .emergency-choice {
    height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid #DCE4EF; border-radius: 9px; background: #FBFCFE;
    color: #43516A; font-size: 13px; cursor: pointer;
  }
  .emergency-choice:has(input:checked) { border-color: #8DBDFF; background: #F2F7FF; color: #1769E8; }
  .emergency-choice input { width: 15px; height: 15px; margin: 0; accent-color: #1677FF; }

  .main {
    height: 558px;
    min-width: 0;
    min-height: 0;
    padding: 10px;
    background: var(--app-bg);
    overflow: hidden;
  }

  .panel {
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-rows: 28px minmax(0, 1fr);
    padding: 11px 12px 12px;
    border-radius: 12px;
    background: var(--panel-bg);
    border: 1px solid #EEF2F6;
    overflow: hidden;
  }

  .panel-head {
    height: 28px;
    min-height: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 0 2px;
  }

  .panel-title {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 600;
  }

  .panel-title-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 0 3px rgba(22,119,255,.08);
  }

  .count {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .mapping-list {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 8px 3px 0 0;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: #C8D0DB transparent;
  }

  .mapping-list::-webkit-scrollbar { width: 6px; }
  .mapping-list::-webkit-scrollbar-track { background: transparent; }
  .mapping-list::-webkit-scrollbar-thumb {
    background: #C8D0DB;
    border-radius: 10px;
  }
  .mapping-list::-webkit-scrollbar-thumb:hover { background: #AEB8C6; }

  .mapping-item {
    width: 100%;
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 10px 10px 11px;
    background: var(--card-bg);
    border: 1px solid #EDF0F5;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(30, 50, 80, 0.04);
  }

  .mapping-item + .mapping-item { margin-top: 8px; }

  .mapping-item.unsaved,
  .mapping-item.editing {
    position: relative;
    min-height: 62px;
    border-color: #8DBDFF;
    box-shadow: 0 2px 8px rgba(22,119,255,.05);
  }

  .status-tag {
    position: absolute;
    left: 10px;
    top: -7px;
    height: 17px;
    display: inline-flex;
    align-items: center;
    padding: 0 6px;
    border-radius: 5px;
    background: #EAF3FF;
    color: #1769E8;
    border: 1px solid #CFE1FF;
    font-size: 10px;
    font-weight: 600;
    line-height: 1;
  }

  .map-flow {
    min-width: 0;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .keycap {
    width: 104px;
    min-width: 104px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    color: #2D4F84;
    background: #EEF5FF;
    border: 1px solid #DCEAFF;
  }

  .keycap.target {
    color: #35684C;
    background: #EFF9F3;
    border-color: #DDEFE4;
  }

  .arrow {
    width: 18px;
    flex: 0 0 18px;
    text-align: center;
    color: #98A2B3;
    font-size: 17px;
  }

  .record-box {
    width: 222px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed #B8C3D2;
    border-radius: 8px;
    background: #FBFCFE;
    color: #778398;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    padding: 0 8px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .record-box:hover { border-color: #7EADFA; background: #F7FAFF; }
  .record-box.recording {
    border-style: solid;
    border-color: var(--primary);
    color: var(--primary);
    background: #F2F7FF;
    box-shadow: 0 0 0 2px rgba(22,119,255,.08);
  }

  .record-box.saved-value {
    cursor: default;
  }

  .record-box.saved-value:hover {
    border-color: #B8C3D2;
    background: #FBFCFE;
  }

  .record-wrap {
    position: relative;
    width: 222px;
    min-width: 0;
    height: 38px;
    flex: 0 1 222px;
  }

  .record-wrap .record-box {
    width: 100%;
    padding: 0 8px;
    text-align: center;
  }

  .clear-target,
  .record-clear {
    position: absolute;
    z-index: 2;
    right: -5px;
    top: -5px;
    width: 17px;
    height: 17px;
    padding: 0;
    border: 1px solid #D8DEE8;
    border-radius: 50%;
    background: #FFFFFF;
    color: #98A2B3;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    box-shadow: 0 1px 4px rgba(30, 50, 80, .10);
  }

  .clear-target:hover,
  .record-clear:hover {
    color: #667085;
    border-color: #C7D0DC;
    background: #F7F9FC;
  }

  .item-actions {
    width: 122px;
    flex: 0 0 122px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-btn {
    width: 58px;
    height: 31px;
    border: 1px solid #E3E8EF;
    border-radius: 7px;
    background: #fff;
    color: #536174;
    font-size: 11.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    padding: 0 5px;
    white-space: nowrap;
  }

  .mini-btn:hover { background: #F8FAFC; border-color: #D7DEE8; }
  .mini-btn.primary { color: #1769E8; border-color: #CFE1FF; background: #F8FBFF; }
  .mini-btn.primary:hover { background: #EEF5FF; }
  .mini-btn.danger { color: var(--danger); }
  .mini-btn.danger:hover { background: #FFF7F7; border-color: #F4CCCC; }
  .mini-btn:disabled { opacity: .45; cursor: not-allowed; background: #F7F8FA; }


  .empty-state {
    height: 100%;
    display: grid;
    place-items: center;
    color: var(--text-secondary);
    font-size: 12px;
  }

  .confirm-backdrop {
    position: absolute;
    inset: 0;
    z-index: 1300;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(23, 35, 60, .18);
  }

  .confirm-backdrop.show { display: flex; }

  .confirm-dialog {
    width: 292px;
    padding: 17px;
    border: 1px solid #E3E8EF;
    border-radius: 12px;
    background: #FFFFFF;
    box-shadow: 0 14px 34px rgba(25, 42, 70, .18);
  }

  .confirm-title {
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
  }

  .confirm-text {
    margin-top: 7px;
    color: #667085;
    font-size: 11.5px;
    line-height: 1.6;
  }

  .confirm-actions {
    margin-top: 15px;
    display: flex;
    justify-content: flex-end;
    gap: 7px;
  }

  .confirm-btn {
    min-width: 58px;
    height: 31px;
    padding: 0 12px;
    border: 1px solid #E1E6ED;
    border-radius: 7px;
    background: #FFFFFF;
    color: #4C596B;
    font-size: 11.5px;
    cursor: pointer;
  }

  .confirm-btn:hover { background: #F7F9FC; }
  .confirm-btn.danger {
    border-color: #E5484D;
    background: #E5484D;
    color: #FFFFFF;
  }
  .confirm-btn.danger:hover { background: #D93E43; }

  @media (max-width: 1019px), (max-height: 599px) {
    body { overflow: auto; }
  }
</style>
</head>
<body>
  <div class="app" role="application" aria-label="键鼠映射工具">
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="6" width="18" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M6 9h1M10 9h1M14 9h1M18 9h.1M6 12h1M10 12h1M14 12h1M18 12h.1M7 15h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="title-text">键鼠映射工具 V1.7 （开源版）</div>
        <div class="global-input-control"><button id="globalInputSwitch" class="global-input-switch on" type="button" role="switch" aria-label="启用或关闭按键接管" aria-checked="true"></button><span id="globalInputDisabledNote" class="global-input-disabled-note">已禁止所有的按键脚本，释放所有热键</span></div>
      </div>
      <div class="window-actions" aria-label="窗口控制">
        <button class="win-btn topmost" aria-label="窗口置顶" aria-pressed="false">
          <svg viewBox="0 0 16 16"><path d="M5 2.5h6M6 2.5l.5 3-2 2v1h7v-1l-2-2 .5-3M8 8.5v5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="win-btn minimize" aria-label="最小化">
          <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
        </button>
        <button class="win-btn close" aria-label="关闭">
          <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect x="4.5" y="8" width="23" height="16" rx="3" stroke="currentColor" stroke-width="2"/>
              <path d="M8 12h2M13 12h2M18 12h2M23 12h1M8 16h2M13 16h2M18 16h2M23 16h1M10 20h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="brand-title">键鼠映射</div>
          <div class="brand-subtitle">让操作更高效</div>
        </div>

        <div class="add-area">
          <button id="addMapping" class="add-btn" type="button">＋ 添加映射</button>
          <div id="addWarning" class="add-warning" role="status" aria-live="polite">请先保存或删除“未保存”映射</div>
        </div>

      </aside>

      <main class="main">
        <section class="panel" aria-label="映射管理区域">
          <div class="panel-head">
            <div id="panelTitle" class="panel-title"><span class="panel-title-dot"></span>映射管理</div>
            <div id="count" class="count"></div>
          </div>
          <div id="mappingList" class="mapping-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="confirmBackdrop" class="confirm-backdrop" aria-hidden="true">
      <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
        <div id="confirmTitle" class="confirm-title">确认删除映射？</div>
        <div id="confirmText" class="confirm-text">删除后无法恢复。</div>
        <div class="confirm-actions">
          <button id="confirmCancel" class="confirm-btn" type="button">取消</button>
          <button id="confirmDelete" class="confirm-btn danger" type="button">删除</button>
        </div>
      </div>
    </div>

  </div>

<script type="text/plain" id="legacyPrototype">
(() => {
  const mappingList = document.getElementById('mappingList');
  const addButton = document.getElementById('addMapping');
  const addWarning = document.getElementById('addWarning');
  const countEl = document.getElementById('count');
  const confirmBackdrop = document.getElementById('confirmBackdrop');
  const confirmText = document.getElementById('confirmText');
  const confirmCancel = document.getElementById('confirmCancel');
  const confirmDelete = document.getElementById('confirmDelete');

  let nextId = 1;
  let mappings = [];

  let recording = null;
  let pendingDeleteId = null;

  function keyLabel(event) {
    const map = {
      ' ': '空格',
      'Escape': 'Esc',
      'ArrowUp': '↑',
      'ArrowDown': '↓',
      'ArrowLeft': '←',
      'ArrowRight': '→',
      'Control': 'Ctrl',
      'Meta': 'Win',
      'Backspace': 'Backspace',
      'Enter': 'Enter',
      'Tab': 'Tab',
      'CapsLock': 'Caps',
      'Delete': 'Del'
    };
    if (map[event.key]) return map[event.key];
    if (event.key.length === 1) return event.key.toUpperCase();
    return event.key;
  }

  function showAddWarning() {
    addWarning.classList.add('show');
  }

  function hideAddWarning() {
    addWarning.classList.remove('show');
  }

  function openDeleteConfirm(item) {
    pendingDeleteId = item.id;
    confirmText.textContent = `确定删除“${item.from} → ${item.to || '无'}”这条映射吗？删除后无法恢复。`;
    confirmBackdrop.classList.add('show');
    confirmBackdrop.setAttribute('aria-hidden', 'false');
    confirmDelete.focus();
  }

  function closeDeleteConfirm() {
    pendingDeleteId = null;
    confirmBackdrop.classList.remove('show');
    confirmBackdrop.setAttribute('aria-hidden', 'true');
  }

  function updateCount() {
    const saved = mappings.filter(m => m.saved).length;
    const pending = mappings.filter(m => !m.saved).length;
    countEl.textContent = pending ? `${saved} 条已保存 · ${pending} 条待保存` : `${saved} 条映射`;
  }

  function render() {
    recording = null;
    updateCount();

    if (!mappings.length) {
      mappingList.innerHTML = '<div class="empty-state">暂无映射，点击左侧“添加映射”开始。</div>';
      return;
    }

    mappingList.innerHTML = mappings.map(item => {
      if (!item.saved) {
        return `
          <div class="mapping-item unsaved" data-id="${item.id}">
            <span class="status-tag">未保存</span>
            <div class="map-flow">
              <button type="button" class="record-box" data-action="record" data-field="from" aria-label="设置触发按键">${item.from || ''}</button>
              <span class="arrow">→</span>
              <span class="record-wrap">
                <button type="button" class="record-box" data-action="record" data-field="to" aria-label="设置映射按键">${item.to || '无'}</button>
                <button type="button" class="clear-target" data-action="clear-target" aria-label="清空映射">×</button>
              </span>
            </div>
            <div class="item-actions">
              <button type="button" class="mini-btn primary" data-action="save" ${!item.from ? 'disabled' : ''}>保存</button>
              <button type="button" class="mini-btn danger" data-action="delete">删除</button>
            </div>
          </div>`;
      }

      if (item.editing) {
        return `
          <div class="mapping-item editing" data-id="${item.id}">
            <span class="status-tag">修改中</span>
            <div class="map-flow">
              <button type="button" class="record-box" data-action="record" data-field="from" aria-label="设置触发按键">${item.from || ''}</button>
              <span class="arrow">→</span>
              <span class="record-wrap">
                <button type="button" class="record-box" data-action="record" data-field="to" aria-label="设置映射按键">${item.to || '无'}</button>
                <button type="button" class="clear-target" data-action="clear-target" aria-label="清空映射">×</button>
              </span>
            </div>
            <div class="item-actions">
              <button type="button" class="mini-btn primary" data-action="save-edit" ${!item.from ? 'disabled' : ''}>保存</button>
              <button type="button" class="mini-btn" data-action="cancel-edit">取消</button>
            </div>
          </div>`;
      }

      return `
        <div class="mapping-item" data-id="${item.id}">
          <div class="map-flow">
            <span class="record-box saved-value">${item.from}</span>
            <span class="arrow">→</span>
            <span class="record-box saved-value">${item.to || '无'}</span>
          </div>
          <div class="item-actions">
            <button type="button" class="mini-btn" data-action="edit">修改</button>
            <button type="button" class="mini-btn danger" data-action="delete">删除</button>
          </div>
        </div>`;
    }).join('');
  }

  addButton.addEventListener('click', () => {
    const existingUnsaved = mappings.find(m => !m.saved);
    if (existingUnsaved) {
      showAddWarning();
      return;
    }

    hideAddWarning();
    mappings.unshift({ id: nextId++, from: '', to: '', saved: false });
    render();
    mappingList.scrollTo({ top: 0, behavior: 'auto' });
    const firstRecord = mappingList.querySelector('.unsaved .record-box');
    if (firstRecord) firstRecord.focus();
  });

  mappingList.addEventListener('wheel', (event) => {
    const maxScrollTop = mappingList.scrollHeight - mappingList.clientHeight;
    if (maxScrollTop <= 0) return;

    const nextTop = Math.max(0, Math.min(maxScrollTop, mappingList.scrollTop + event.deltaY));
    if (nextTop !== mappingList.scrollTop) {
      mappingList.scrollTop = nextTop;
      event.preventDefault();
    }
  }, { passive: false });

  mappingList.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;

    const row = button.closest('.mapping-item');
    const id = Number(row.dataset.id);
    const item = mappings.find(m => m.id === id);
    if (!item) return;

    const action = button.dataset.action;

    if (action === 'record') {
      mappingList.querySelectorAll('.record-box.recording').forEach(el => el.classList.remove('recording'));
      button.classList.add('recording');
      recording = { id, field: button.dataset.field, button };
      button.focus();
      return;
    }

    if (action === 'clear-target') {
      item.to = '';
      recording = null;
      render();
      return;
    }

    if (action === 'save') {
      if (!item.from) return;
      item.saved = true;
      hideAddWarning();
      render();
      return;
    }

    if (action === 'edit') {
      item.editing = true;
      item.beforeEdit = { from: item.from, to: item.to };
      render();
      return;
    }

    if (action === 'save-edit') {
      if (!item.from) return;
      item.editing = false;
      delete item.beforeEdit;
      render();
      return;
    }

    if (action === 'cancel-edit') {
      if (item.beforeEdit) {
        item.from = item.beforeEdit.from;
        item.to = item.beforeEdit.to;
      }
      item.editing = false;
      delete item.beforeEdit;
      render();
      return;
    }

    if (action === 'delete') {
      if (item.saved) {
        openDeleteConfirm(item);
        return;
      }

      mappings = mappings.filter(m => m.id !== id);
      hideAddWarning();
      render();
    }
  });

  confirmCancel.addEventListener('click', closeDeleteConfirm);

  confirmDelete.addEventListener('click', () => {
    if (pendingDeleteId === null) return;
    mappings = mappings.filter(m => m.id !== pendingDeleteId);
    closeDeleteConfirm();
    render();
  });

  confirmBackdrop.addEventListener('click', (event) => {
    if (event.target === confirmBackdrop) closeDeleteConfirm();
  });

  // bridge.js 是桌面版的唯一交互入口，避免旧脚本抢先处理键盘事件。
  document.addEventListener('keydown', () => {}, true);

  document.addEventListener('click', (event) => {
    if (!recording) return;
    if (event.target.closest('.record-box')) return;
    render();
  });

  render();
})();
</script>
</body>
</html>
